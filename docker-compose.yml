# Sobe o site inteiro com um comando:
#
#   PUID=$(id -u) PGID=$(id -g) docker compose up -d --build
#
# Para trocar a senha do painel depois:
#   docker compose exec marmitas python3 servidor.py --definir-senha

services:
  marmitas:
    build: .
    image: marmitas-poa:latest
    container_name: marmitas
    restart: unless-stopped

    # Só o próprio host alcança esta porta: quem atende a internet é o nginx
    # (com HTTPS) e ele repassa para cá. Nunca use "4173:4173" numa VPS exposta:
    # isso publicaria o painel sem TLS.
    ports:
      - "127.0.0.1:4173:4173"

    # A pasta do projeto é o estado do site: dados.js publicado, imagens,
    # banco e senha. Deixando ela montada, atualizar o site é atualizar os
    # arquivos da pasta (git pull / rsync) e reiniciar o container.
    volumes:
      - ./:/app

    environment:
      TZ: America/Sao_Paulo

    # O container escreve no volume (dados.js, img/, marmitas.db, .tmp). Rodando
    # com o mesmo uid do dono da pasta, os arquivos não ficam com dono root.
    # Passe PUID/PGID no comando, ou fixe os números aqui.
    user: "${PUID:-1000}:${PGID:-1000}"
